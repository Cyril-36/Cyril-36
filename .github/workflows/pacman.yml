name: Generate Contribution Games

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/pacman.yml
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C5CFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF4ECD

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          hide_month_labels: 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Save generated SVGs
        uses: actions/upload-artifact@v4
        with:
          name: contribution-games
          path: dist/*.svg
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve generated SVGs
        uses: actions/download-artifact@v4
        with:
          name: contribution-games
          path: dist

      - name: Publish graphs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
