<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#101827;#0D1117" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#0F2741">
        <animate attributeName="stop-color" values="#0F2741;#132D46;#0F2741" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0B3B36">
        <animate attributeName="stop-color" values="#0B3B36;#123A50;#0B3B36" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(600 150) rotate(90) scale(165 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <g opacity=".36" fill="#58A6FF">
    <circle cx="105" cy="78" r="3">
      <animate attributeName="cy" values="78;55;78" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.8;.25" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="88" r="4">
      <animate attributeName="cy" values="88;118;88" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.9;.3" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1015" cy="235" r="3">
      <animate attributeName="cx" values="1015;1045;1015" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.75;.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="175" cy="244" r="4">
      <animate attributeName="cx" values="175;145;175" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.75;.25" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity=".15" stroke="#8B949E">
    <path d="M0 260 C220 215 340 306 560 260 C780 215 930 287 1200 235"/>
    <path d="M0 278 C190 240 380 310 610 272 C820 238 1010 304 1200 260"/>
  </g>

  <text x="600" y="105" text-anchor="middle" fill="#F0F6FC" font-size="52" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing=".5">
    Chaitanya Pudota
  </text>
  <text x="600" y="147" text-anchor="middle" fill="#C9D1D9" font-size="21" font-weight="500" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1.2">
    AI/ML • Backend Engineering • Reliable AI Systems
  </text>

  <g filter="url(#softGlow)" font-family="JetBrains Mono,Consolas,monospace" font-size="17" fill="#79C0FF" text-anchor="middle">
    <text x="600" y="205" opacity="0">RAG • agents • evaluation • systems that can explain themselves
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.03;0.28;0.33;0.66;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="205" opacity="0">Python • FastAPI • PostgreSQL • pgvector • Docker
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.30;0.33;0.36;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="205" opacity="0">Build → measure → debug → improve → ship
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.62;0.66;0.69;0.72;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(527 240)">
    <rect width="146" height="36" rx="18" fill="#161B22" stroke="#30363D"/>
    <circle cx="22" cy="18" r="5" fill="#3FB950">
      <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="83" y="23" text-anchor="middle" fill="#C9D1D9" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif">Cyril-36</text>
  </g>
</svg>