<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="70" y1="10" x2="1130" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090B12"/>
      <stop offset=".33" stop-color="#171032"/>
      <stop offset=".68" stop-color="#071C2D"/>
      <stop offset="1" stop-color="#061711"/>
    </linearGradient>

    <linearGradient id="neon" x1="310" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4ECD">
        <animate attributeName="stop-color" values="#FF4ECD;#7C5CFF;#00E5FF;#FF4ECD" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".5" stop-color="#7C5CFF">
        <animate attributeName="stop-color" values="#7C5CFF;#00E5FF;#75FF9D;#7C5CFF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#75FF9D;#FF4ECD;#00E5FF" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="blobPink">
      <stop stop-color="#FF4ECD" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF4ECD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue">
      <stop stop-color="#00E5FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect x="55" y="45" width="1090" height="300" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="390" rx="30" fill="#05070A"/>
  <rect x="20" y="20" width="1160" height="350" rx="30" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="20" y="20" width="1160" height="350" rx="30" fill="url(#grid)"/>

  <g clip-path="url(#screen)">
    <circle cx="160" cy="85" r="230" fill="url(#blobPink)">
      <animate attributeName="cx" values="160;350;160" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="85;145;85" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="300" r="260" fill="url(#blobBlue)">
      <animate attributeName="cx" values="1035;880;1035" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;235;300" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(52 47)">
    <circle cx="0" cy="0" r="6" fill="#FF5F57"/>
    <circle cx="21" cy="0" r="6" fill="#FEBB2E"/>
    <circle cx="42" cy="0" r="6" fill="#28C840"/>
    <text x="68" y="5" fill="#7D8590" font-size="13" font-family="JetBrains Mono,Consolas,monospace">cyril@github ~ /profile.exe</text>
  </g>

  <g font-family="JetBrains Mono,Consolas,monospace" opacity=".6">
    <text x="86" y="106" fill="#FF7B72" font-size="18">&lt;dev&gt;
      <animate attributeName="y" values="106;92;106" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="1010" y="112" fill="#79C0FF" font-size="18">0101
      <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="105" y="300" fill="#75FF9D" font-size="16">{ ship(); }
      <animate attributeName="x" values="105;128;105" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="955" y="294" fill="#D2A8FF" font-size="16">git push ✦
      <animate attributeName="y" values="294;278;294" dur="4.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#FFFFFF">
    <circle cx="218" cy="94" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="958" cy="83" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="210" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="222" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="315" cy="327" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="865" cy="324" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="152" text-anchor="middle" fill="#8B949E" font-size="19" font-family="JetBrains Mono,Consolas,monospace">
    yo, i'm
  </text>

  <g filter="url(#glow)">
    <text x="600" y="216" text-anchor="middle" fill="url(#neon)" font-size="60" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="1">
      CHAITANYA PUDOTA
    </text>
  </g>

  <text x="600" y="256" text-anchor="middle" fill="#E6EDF3" font-size="21" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">
    aka Cyril • AI/ML kid • backend enjoyer • professional side-quest collector
  </text>

  <g font-family="JetBrains Mono,Consolas,monospace" font-size="16" text-anchor="middle">
    <text x="600" y="304" fill="#79C0FF" opacity="0">currently cooking: RAG + agents + weirdly specific experiments
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;.04;.28;.33;.66;.96;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="304" fill="#D2A8FF" opacity="0">build → break → debug → somehow ship
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;.29;.33;.37;.62;.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="304" fill="#75FF9D" opacity="0">if it can't be tested, i'm suspicious 👀
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.62;.66;.69;.72;.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(503 326)">
    <rect width="194" height="30" rx="15" fill="#0D1117" stroke="#30363D"/>
    <circle cx="18" cy="15" r="4" fill="#3FB950">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="20" text-anchor="middle" fill="#C9D1D9" font-size="12" font-family="JetBrains Mono,Consolas,monospace">online • probably building</text>
  </g>
</svg>