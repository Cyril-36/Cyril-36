<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Chaitanya Pudota — Cyril</title>
  <desc id="desc">A dark gradient banner with an outlined terminal, connected nodes, and the words: I build AI that can show its work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/><stop offset=".55" stop-color="#13152B"/><stop offset="1" stop-color="#0A1B25"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#818CF8"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".23"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E2E8F0" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="338" rx="25"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="url(#bg)" stroke="#475569" stroke-opacity=".42"/>
