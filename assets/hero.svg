      <rect x="824" y="67" width="282" height="198" rx="19" fill="#11182B" fill-opacity=".65" stroke="#A78BFA" stroke-opacity=".65"/>
      <path d="M824 107h282M848 87h1m16 0h1m16 0h1" stroke-width="5"/>
