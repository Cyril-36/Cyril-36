<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">Cyril in build mode</title>
  <desc id="desc">An original animated illustration of a developer with glasses coding on a laptop, with small glowing code symbols.</desc>
  <defs>
